name: Bug report
description: Report a problem you can reproduce with pi-otel.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy:** don't include credentials, tokens, collector endpoints that embed secrets, prompts, conversation content, or screenshots that show them. Use synthetic or redacted examples. To report a vulnerability, use the private form in [SECURITY.md](https://github.com/leocavalcante/pi-otel/blob/main/SECURITY.md) instead.
  - type: input
    id: pi-version
    attributes:
      label: Pi version
      description: Run `pi --version`. Enter `unknown` if it's unavailable.
      placeholder: 1.5.2
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: pi-otel version
      description: Shown by `pi list`, or in your package.json for SDK use.
      placeholder: 0.1.4
    validations:
      required: true
  - type: dropdown
    id: install-source
    attributes:
      label: How you use pi-otel
      options:
        - Pi extension from npm
        - Pi extension from GitHub
        - Pi extension from a local checkout
        - SDK in a Pi Durable or coding-agent application
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Run `node --version`, if available.
      placeholder: v22.19.0
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: receiver
    attributes:
      label: OTLP receiver
      description: For example, OpenTelemetry Collector 0.140 or a hosted backend. Don't include its URL or credentials.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use synthetic prompts and data.
      placeholder: |
        1. Start Pi with OTEL_EXPORTER_OTLP_ENDPOINT set to a local collector.
        2. Run a prompt that uses a tool.
        3. Look for the `pi.coding.tool` span.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behavior
      description: Describe what you expected and what happened instead, without private content.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Share only sanitized details. Don't attach raw logs, telemetry exports, or transcripts.
